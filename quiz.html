<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="styles.css">

</head>

<body>
  <img src="Assets/bgPic.jpg" class="bg-picture">

  <nav class="navbar navbar-expand-lg bg-body-tertiary pt-0">
    <div class="container-fluid p-3">
      <a class="navbar-brand" href="#">
        <img src="Assets/QA.png" alt="Bootstrap" width="60" height="60">
      </a>
      <span class="navbar-text" id="span-name"></span>
    </div>
  </nav>

  <div id="timer" class="timer fs-3">0:10</div>
  <div id="topic" class="topic fs-3">Question 1/5</div>

  <div class="container mt-5">
    <div class="card shadow">
      <h4 id="question-text" class="ms-5 me-5"></h4>

      <form id="quiz-form" class="mt-4">
        <div class="form-check">
          <input class="form-check-input" type="radio" name="answer" id="a1" value="1">
          <label class="form-check-label" for="a1"></label>
        </div>

        <div class="form-check mt-3">
          <input class="form-check-input" type="radio" name="answer" id="a2" value="2">
          <label class="form-check-label" for="a2"></label>
        </div>

        <div class="form-check mt-3">
          <input class="form-check-input" type="radio" name="answer" id="a3" value="3">
          <label class="form-check-label" for="a3"></label>
        </div>

        <div class="form-check mt-3">
          <input class="form-check-input" type="radio" name="answer" id="a4" value="4">
          <label class="form-check-label" for="a4"></label>
        </div>

      </form>
    </div>
    <button type="button" class="btn btn-success mt-3" onclick="nextQuestion()">Next</button>

  </div>

  <script src="index.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</body>

</html>
